name: iOS 測試版 IPA（沒簽名，用 Sideloadly 自簽安裝）

# repo 是公開的，macOS 機器免費。
# 產出的 IPA 沒有簽名：下載後用 Sideloadly＋自己的 Apple ID 簽名裝到 iPhone（7 天要重簽一次）。
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 建置網頁
        run: npm run build:fast
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - run: npx cap sync ios

      - name: 用最新的 Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: 編譯（不簽名）
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: 檢查螢幕廣播擴充元件有打包進去
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          ls -la "$APP/PlugIns/" || true
          if [ ! -d "$APP/PlugIns/ScreenWatchBroadcast.appex" ]; then
            echo "::error::找不到 App.app/PlugIns/ScreenWatchBroadcast.appex"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :NSExtension" "$APP/PlugIns/ScreenWatchBroadcast.appex/Info.plist"

      # 沒簽名的話 entitlements（App Group）不會寫進執行檔，Sideloadly 重簽時就不知道要加 App Group。
      # 先用 ad-hoc 簽一次把 entitlements 帶進去；Sideloadly 安裝時會再用你的 Apple ID 重簽。
      - name: 用 ad-hoc 簽名帶上 entitlements
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          # 裡面的 framework 要先簽，外層才簽得起來
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --entitlements ios/App/ScreenWatchBroadcast/ScreenWatchBroadcast.entitlements "$APP/PlugIns/ScreenWatchBroadcast.appex"
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP/PlugIns/ScreenWatchBroadcast.appex"
          codesign -d --entitlements - "$APP"

      - name: 打包成 IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry 203Phone.ipa Payload
          ls -lh 203Phone.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: 203Phone-unsigned-ipa
          path: ${{ runner.temp }}/ipa/203Phone.ipa
          retention-days: 14
