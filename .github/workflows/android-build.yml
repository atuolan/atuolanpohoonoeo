name: Android APK

# 跟本機 npm run android:apk 一樣：建置網頁 → cap sync → gradlew assembleDebug。
#
# ⚠️ 簽名：Android 只讓「同一把金鑰簽的 APK」覆蓋安裝舊版。舊版不能覆蓋就得先解除安裝，
# App 裡的資料（聊天、角色）會全部消失。
# 本機 assembleDebug 用的是那台電腦的 ~/.android/debug.keystore（Windows 在 %USERPROFILE%\.android\debug.keystore）。
# 把那個檔案轉成 base64 存進 GitHub Secrets 的 ANDROID_DEBUG_KEYSTORE_BASE64，這裡打出來的 APK 才能直接覆蓋安裝。
# 沒設定時一樣會打包（確認編譯得過），但用的是 GitHub 機器臨時產生的金鑰：
# 檔名會標「TEST-ONLY」，只能裝在沒裝過的手機上測試，不要發給使用者。
on:
  workflow_dispatch:
  push:
    branches: [master, "claude/**"]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 建置網頁
        run: npm run build:fast
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 放入原本打包用的金鑰
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "用 Secrets 裡的金鑰簽名"
          else
            echo "suffix=-TEST-ONLY-cannot-update-existing-install" >> "$GITHUB_OUTPUT"
            echo "::warning::沒有設定 ANDROID_DEBUG_KEYSTORE_BASE64：這個 APK 的簽名跟使用者手上的不同，不能覆蓋安裝，不要發給使用者"
          fi

      - name: 編譯 APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon --stacktrace

      - name: 整理檔名、印出簽名指紋
        id: apk
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          NAME="203Phone-${VERSION}${{ steps.keystore.outputs.suffix }}"
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/$NAME.apk"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          # 跟舊版 APK 的指紋一樣才能覆蓋安裝
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/apk/$NAME.apk" | grep -i "SHA-256"
          ls -lh "$RUNNER_TEMP/apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ runner.temp }}/apk/*.apk
          retention-days: 14
