<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Huninn";
    src: url("./huninn.ttf");
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { display: flex; flex-wrap: wrap; width: 1440px; }
  .s { width: 240px; height: 240px; display: block; }
  .s svg { width: 240px; height: 240px; display: block; overflow: visible; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.14)); }
  .halo, .halo * { stroke: #fff !important; fill: #fff !important; stroke-width: 16px !important; stroke-linejoin: round !important; stroke-linecap: round !important; }
  text { font-family: "Huninn"; }
</style>
</head>
<body>
<script>
const C = {
  green: "#22b35e", orange: "#ff8a1f", pink: "#ff5c93", blue: "#3388ff",
  purple: "#8a5cf5", red: "#f0443a", gray: "#6f7c8f",
};
const INK = "#3a3a3a";

function star(cx, cy, R, r, fill) {
  let d = "";
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    const rad = i % 2 ? r : R;
    d += (i ? "L" : "M") + (cx + rad * Math.cos(a)).toFixed(1) + " " + (cy + rad * Math.sin(a)).toFixed(1);
  }
  return `<path d="${d}Z" fill="${fill}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
}
const HEART = "M50 88 C20 64 6 47 6 31 C6 16 18 7 31 7 C40 7 46 12 50 19 C54 12 60 7 69 7 C82 7 94 16 94 31 C94 47 80 64 50 88Z";
const DROP = "M50 8 C50 8 20 48 20 64 A30 30 0 0 0 80 64 C80 48 50 8 50 8Z";

const FACE = `<circle cx="50" cy="54" r="40" fill="#ffd34d" stroke="${INK}" stroke-width="4"/>`;
const HAPPY_EYES = `<path d="M28 50 Q35 40 42 50 M58 50 Q65 40 72 50" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
const BLUSH = `<ellipse cx="26" cy="64" rx="7" ry="4.5" fill="#ff8fb1"/><ellipse cx="74" cy="64" rx="7" ry="4.5" fill="#ff8fb1"/>`;
const SPARK = (x, y, r, c) => `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r}Z" fill="${c}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;

// 每個塗鴉畫在 100×100 的格子裡
const DOODLES = {
  check: `<path d="M16 54 L40 78 L86 24" fill="none" stroke="${C.green}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>`,
  ring: SPARK(38, 52, 34, "#ffd23f") + SPARK(80, 22, 18, "#ffb36b") + SPARK(82, 80, 12, "#ffd23f"),
  star: star(50, 52, 44, 19, "#ffd23f"),
  question: `<path d="M14 18 Q14 8 24 8 L80 8 Q90 8 90 18 L90 60 Q90 70 80 70 L44 70 L26 90 L30 70 L24 70 Q14 70 14 60Z" fill="${C.purple}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
             <text x="52" y="60" text-anchor="middle" font-size="54" fill="#fff">?</text>`,
  sweat: `<path d="${DROP}" fill="#8fd0ff" stroke="#2f7fd6" stroke-width="5"/><path d="M38 62 Q38 50 46 44" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`,
  clock: `<circle cx="50" cy="52" r="38" fill="#fff" stroke="${C.orange}" stroke-width="9"/>
          <path d="M50 52 L50 28 M50 52 L68 62" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>
          <circle cx="50" cy="52" r="5" fill="${INK}"/>`,
  speed: `<path d="M10 28 L70 28 M24 50 L92 50 M6 72 L62 72" stroke="${C.green}" stroke-width="10" stroke-linecap="round"/>`,
  sun: `<path d="M50 4 L50 18 M50 82 L50 96 M4 50 L18 50 M82 50 L96 50 M17 17 L27 27 M73 73 L83 83 M83 17 L73 27 M27 73 L17 83" stroke="#ffb300" stroke-width="8" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="24" fill="#ffd23f" stroke="${INK}" stroke-width="4"/>`,
  moon: `<path d="M58 10 A40 40 0 1 0 90 62 A32 32 0 1 1 58 10Z" fill="#ffd54a" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
         <text x="78" y="30" font-size="26" fill="${C.purple}">z</text><text x="88" y="12" font-size="18" fill="${C.purple}">z</text>`,
  flower: [0, 72, 144, 216, 288].map((a) => {
            const r = (a * Math.PI) / 180;
            return `<circle cx="${(50 + 24 * Math.sin(r)).toFixed(1)}" cy="${(52 - 24 * Math.cos(r)).toFixed(1)}" r="18" fill="#ff9cc2" stroke="${INK}" stroke-width="4"/>`;
          }).join("") + `<circle cx="50" cy="52" r="13" fill="#ffd23f" stroke="${INK}" stroke-width="4"/>`,
  tea: `<path d="M34 6 Q26 16 34 24 M50 4 Q42 14 50 22 M66 6 Q58 16 66 24" fill="none" stroke="#9aa5b1" stroke-width="5" stroke-linecap="round"/>
        <path d="M14 34 L80 34 L74 78 Q72 90 60 90 L34 90 Q22 90 20 78Z" fill="#a8e6bd" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
        <path d="M80 44 Q96 44 94 58 Q92 70 76 70" fill="none" stroke="${INK}" stroke-width="5"/>`,
  flame: `<path d="M50 4 C62 26 84 36 84 62 A34 34 0 0 1 16 62 C16 46 28 38 32 24 C40 34 44 40 44 46 C50 34 52 20 50 4Z" fill="#ff6b3d" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
          <path d="M50 52 C56 62 66 66 66 76 A16 16 0 0 1 34 76 C34 66 44 62 50 52Z" fill="#ffd23f"/>`,
  confetti: `<rect x="10" y="20" width="14" height="22" rx="3" fill="${C.pink}" transform="rotate(-24 17 31)"/>
             <rect x="70" y="10" width="14" height="22" rx="3" fill="${C.blue}" transform="rotate(28 77 21)"/>
             <rect x="40" y="60" width="14" height="22" rx="3" fill="#ffd23f" transform="rotate(14 47 71)"/>
             <circle cx="78" cy="66" r="8" fill="${C.green}"/><circle cx="40" cy="14" r="7" fill="${C.orange}"/><circle cx="14" cy="78" r="7" fill="${C.purple}"/>`,
  shake: `<path d="M20 22 Q8 50 20 78 M38 30 Q30 50 38 70 M80 22 Q92 50 80 78 M62 30 Q70 50 62 70" fill="none" stroke="${C.orange}" stroke-width="8" stroke-linecap="round"/>`,
  tears: FACE + `<path d="M26 44 L40 50 L26 56 M74 44 L60 50 L74 56" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M32 66 Q50 92 68 66Z" fill="#e8475f" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
          <path d="${DROP}" fill="#8fd0ff" stroke="#2f7fd6" stroke-width="7" transform="translate(-14 26) rotate(-50 25 25) scale(0.32)"/>
          <path d="${DROP}" fill="#8fd0ff" stroke="#2f7fd6" stroke-width="7" transform="translate(84 10) rotate(50 25 25) scale(0.32)"/>`,
  nod: FACE + HAPPY_EYES + BLUSH + `<path d="M40 70 Q50 78 60 70" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
        <path d="M8 22 Q4 34 8 46 M92 22 Q96 34 92 46" fill="none" stroke="${C.green}" stroke-width="6" stroke-linecap="round"/>`,
  gloom: `<path d="M24 8 L24 70 M50 8 L50 86 M76 8 L76 70" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`,
  dots: `<circle cx="18" cy="60" r="10" fill="${C.gray}"/><circle cx="50" cy="60" r="10" fill="${C.gray}"/><circle cx="82" cy="60" r="10" fill="${C.gray}"/>`,
  anger: `<path d="M18 38 Q38 38 38 18 M62 18 Q62 38 82 38 M82 62 Q62 62 62 82 M38 82 Q38 62 18 62" fill="none" stroke="${C.red}" stroke-width="11" stroke-linecap="round"/>`,
  cross: `<path d="M18 18 L82 82 M82 18 L18 82" stroke="${C.red}" stroke-width="15" stroke-linecap="round"/>`,
  tear: FACE + `<circle cx="35" cy="50" r="8" fill="${INK}"/><circle cx="65" cy="50" r="8" fill="${INK}"/>
        <circle cx="37" cy="47" r="3" fill="#fff"/><circle cx="67" cy="47" r="3" fill="#fff"/>
        <path d="M38 76 Q44 70 50 76 Q56 82 62 76" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
        <path d="${DROP}" fill="#8fd0ff" stroke="#2f7fd6" stroke-width="8" transform="translate(22 56) scale(0.24)"/>`,
  arms: FACE + HAPPY_EYES + BLUSH + `<path d="M44 64 Q50 70 56 64" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
         <path d="M6 70 Q30 98 62 84 M94 70 Q70 98 38 84" fill="none" stroke="#ffb347" stroke-width="12" stroke-linecap="round"/>
         <path d="M6 70 Q30 98 62 84 M94 70 Q70 98 38 84" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" opacity="0.5"/>`,
  hearts: `<path d="${HEART}" fill="${C.pink}" stroke="${INK}" stroke-width="6" transform="translate(4 30) scale(0.5)"/>
           <path d="${HEART}" fill="#ff9cc2" stroke="${INK}" stroke-width="8" transform="translate(56 4) scale(0.38)"/>
           <path d="${HEART}" fill="${C.red}" stroke="${INK}" stroke-width="10" transform="translate(62 62) scale(0.3)"/>`,
  heart: `<path d="${HEART}" fill="${C.red}" stroke="${INK}" stroke-width="4"/><path d="M24 26 Q26 18 34 17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`,
};

// [文字, 字色, 塗鴉, 塗鴉位置 x y 大小, 文字旋轉]
const STICKERS = [
  ["收到", C.green, "check", 150, 18, 76, -5],
  ["好的", C.orange, "ring", 14, 14, 70, 4],
  ["OK", C.blue, "star", 152, 10, 78, -6],
  ["在嗎", C.purple, "question", 150, 8, 80, 3],
  ["在忙", C.blue, "sweat", 164, 22, 58, -4],
  ["等我|一下", C.orange, "clock", 186, -4, 50, -3],
  ["馬上到", C.green, "speed", 8, 30, 76, -3],
  ["早安", C.orange, "sun", 150, 6, 82, 5],
  ["晚安", C.purple, "moon", 14, 6, 84, -4],
  ["謝謝", C.pink, "flower", 156, 10, 74, 4],
  ["辛苦了", C.green, "tea", 150, 4, 78, -3],
  ["加油", C.red, "flame", 156, 4, 76, -6],
  ["好耶", C.pink, "confetti", 14, 8, 90, 5],
  ["哈哈|哈哈", C.orange, "shake", 180, 0, 56, 4],
  ["笑死", C.blue, "tears", 134, 8, 78, -5],
  ["嗯嗯", C.green, "nod", 150, 8, 78, 3],
  ["???", C.purple, "gloom", 160, 8, 62, 0],
  ["無語", C.gray, "dots", 80, 14, 80, -3],
  ["哼", C.red, "anger", 150, 10, 74, -6],
  ["不要", C.red, "cross", 154, 12, 68, 4],
  ["委屈", C.blue, "tear", 150, 8, 78, -4],
  ["抱抱", C.pink, "arms", 146, 6, 84, 3],
  ["想你了", C.pink, "hearts", 146, 2, 86, -3],
  ["愛你", C.red, "heart", 148, 6, 84, 5],
];

function fontSize(text) {
  const n = [...text].length;
  if (text === "OK") return 120;
  if (text === "???") return 112;
  if (text.includes("|")) return 84;
  return n === 1 ? 140 : n === 2 ? 98 : n === 3 ? 70 : 54;
}

for (const [text, color, doodle, dx, dy, ds, rot] of STICKERS) {
  const size = fontSize(text);
  const scale = ds / 100;
  const art = DOODLES[doodle];
  const g = `transform="translate(${dx} ${dy + 10}) scale(${scale})"`;
  const lines = text.split("|");
  const ty = lines.length > 1 ? 136 : 186;
  const body = lines.length > 1 ? lines.map((l, i) => `<tspan x="${i ? 136 : 104}" dy="${i ? size * 0.98 : 0}">${l}</tspan>`).join("") : text;
  const textAttrs = `x="120" y="${ty}" text-anchor="middle" font-size="${size}" font-weight="700" transform="rotate(${rot} 120 ${ty - size * 0.35})"`;
  const el = document.createElement("div");
  el.className = "s";
  el.innerHTML = `<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
    <g class="halo"><g ${g}>${art}</g><text ${textAttrs}>${body}</text></g>
    <g ${g}>${art}</g>
    <text ${textAttrs} fill="${color}" stroke="${INK}" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${body}</text>
  </svg>`;
  document.body.appendChild(el);
}
document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
